<aside
  class="tool-dock"
  data-tool-dock
  data-agenda-source="{{ 'data/schedule.yml' | url }}"
  aria-label="Externe tools"
>

  <button
    class="tool-dock__toggle"
    type="button"
    data-tool-dock-toggle
    aria-expanded="false"
    aria-controls="tool-dock-panel"
  >
    <span class="tool-dock__toggle-icon" aria-hidden="true">‹</span>
    <span class="tool-dock__sr-only">Open externe tools</span>
  </button>

  <nav class="tool-dock__panel" id="tool-dock-panel">

    <button
      class="tool-dock__item"
      type="button"
      data-student-tool="github"
      aria-label="Open jouw GitHub"
      title="GitHub"
    >
      <img
        class="tool-dock__icon-image"
        src="{{ 'assets/images/tool-dock/github.png' | url }}"
        alt=""
      >
    </button>

    <button
      class="tool-dock__item"
      type="button"
      data-student-tool="codespaces"
      aria-label="Open jouw Codespace"
      title="GitHub Codespaces"
    >
      <img
        class="tool-dock__icon-image"
        src="{{ 'assets/images/tool-dock/codespaces.png' | url }}"
        alt=""
      >
    </button>

    <a
      class="tool-dock__item"
      href="https://lucid.app/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Lucidchart"
      title="Lucidchart"
    >
      <img
        class="tool-dock__icon-image"
        src="{{ 'assets/images/tool-dock/lucidchart.png' | url }}"
        alt=""
      >
    </a>

    <button
      class="tool-dock__item"
      type="button"
      data-agenda-open
      aria-label="Open agenda"
      title="Agenda"
    >
      <span class="tool-dock__calendar-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="img" focusable="false">
          <rect x="7" y="10" width="34" height="31" rx="7"></rect>
          <path d="M15 6v8M33 6v8M7 19h34"></path>
          <path d="M15 26h4M24 26h4M33 26h1M15 33h4M24 33h4"></path>
        </svg>
      </span>
    </button>

    <a
      class="tool-dock__item"
      href="https://greenteapress.com/thinkpython2/thinkpython2.pdf"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Think Python"
      title="Think Python"
    >
      <img
        class="tool-dock__icon-image"
        src="{{ 'assets/images/tool-dock/think-python.png' | url }}"
        alt=""
      >
    </a>

  </nav>
</aside>


<div
  class="tool-access-modal"
  data-tool-access-modal
  hidden
>
  <div
    class="tool-access-modal__backdrop"
    data-tool-access-close
  ></div>

  <section
    class="tool-access-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tool-access-title"
  >
    <button
      class="tool-access-modal__close"
      type="button"
      data-tool-access-close
      aria-label="Sluiten"
    >
      ×
    </button>

    <img
      class="tool-access-modal__logo"
      data-tool-access-logo
      src=""
      alt=""
    >

    <h2
      class="tool-access-modal__title"
      id="tool-access-title"
      data-tool-access-title
    >
      Open jouw omgeving
    </h2>

    <p
      class="tool-access-modal__intro"
      data-tool-access-intro
    >
      Vul je leerlingnummer in.
    </p>

    <form data-tool-access-form>

      <label
        class="tool-access-modal__label"
        data-tool-access-label
        for="tool-access-username"
      >
        GitHub-gebruikersnaam
      </label>

        <input
          class="tool-access-modal__input"
          id="tool-access-username"
          data-tool-access-input
          type="text"
          autocomplete="username"
          spellcheck="false"
          placeholder="Bijvoorbeeld onc-123456"
          required
        >

      <p
        class="tool-access-modal__error"
        data-tool-access-error
        hidden
      >
        Vul een geldig leerlingnummer in.
      </p>

      <button
        class="tool-access-modal__submit"
        type="submit"
        data-tool-access-submit
      >
        Open
      </button>

    </form>
  </section>
</div>


<div class="agenda-modal" data-agenda-modal hidden>
  <div class="agenda-modal__backdrop" data-agenda-close></div>

  <section
    class="agenda-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="agenda-title"
  >

    <button
      class="agenda-modal__close"
      type="button"
      data-agenda-close
      aria-label="Sluiten"
    >
      ×
    </button>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="agenda-modal__header">

      <span class="agenda-modal__header-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" role="img" focusable="false">
          <rect x="7" y="10" width="34" height="31" rx="7"></rect>
          <path d="M15 6v8M33 6v8M7 19h34"></path>
          <path d="M15 26h4M24 26h4M33 26h1M15 33h4M24 33h4"></path>
        </svg>
      </span>

      <div class="agenda-modal__heading">
        <h2 class="agenda-modal__title" id="agenda-title">
          Jouw planning
        </h2>

        <p class="agenda-modal__subtitle">
          Alle lesmomenten en deadlines uit Module 01.
        </p>

        <p
          class="agenda-modal__class"
          data-agenda-class-label
          hidden
        ></p>
      </div>

    </header>


    <!-- =====================================================
         KLAS KIEZEN
         ===================================================== -->

    <div
      class="agenda-modal__class-picker"
      data-agenda-class-picker
    >
      <p class="agenda-modal__intro">
        Kies je klas om jouw planning te zien.
      </p>

      <div
        class="agenda-modal__classes"
        data-agenda-class-buttons
      ></div>

      <p class="agenda-modal__hint">
        Deze keuze wordt alleen in deze browser onthouden.
      </p>
    </div>


    <!-- =====================================================
         PLANNING
         ===================================================== -->

    <div
      class="agenda-modal__content"
      data-agenda-content
      hidden
    >

      <div class="agenda-modal__tabs">
        <button
          class="agenda-modal__tab is-active"
          type="button"
          data-agenda-view="upcoming"
        >
          Komende activiteiten
        </button>

        <button
          class="agenda-modal__tab"
          type="button"
          data-agenda-view="all"
        >
          Volledige agenda
        </button>
      </div>


      <div
        class="agenda-modal__items"
        data-agenda-items
      ></div>


      <div class="agenda-modal__footer">
        <button
          class="agenda-modal__change-class"
          type="button"
          data-agenda-change-class
        >
          Klas wijzigen
        </button>
      </div>

    </div>

  </section>
</div>
